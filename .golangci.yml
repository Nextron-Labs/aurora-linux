# golangci-lint configuration for Aurora Linux (v2 format)
# https://golangci-lint.run/usage/configuration/
version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*compress/gzip.Reader).Close
        - (*archive/zip.ReadCloser).Close
        - os.RemoveAll
        - (net.PacketConn).SetReadDeadline
        - (net.Conn).SetReadDeadline
        - fmt.Fprintln
        - fmt.Fprintf
        - syscall.Close
    gocritic:
      disabled-checks:
        - appendAssign
        - commentFormatting
      enabled-tags:
        - diagnostic
    gocyclo:
      min-complexity: 50
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - govet
          - unused
        path: lib/provider/ebpf/.*_bpfel\.go$
      - linters:
          - gocritic
        text: (paramTypeCombine|unnamedResult|httpNoBody|octalLiteral|unnecessaryDefer|filepathJoin|stringConcatSimplify)
      - linters:
          - revive
        text: (stutters|exported:|should have comment|var-naming|increment-decrement)
    paths:
      - third_party/
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra-rules: false
  exclusions:
    generated: lax
    paths:
      - third_party/
      - builtin$
      - examples$
      - \.go$
